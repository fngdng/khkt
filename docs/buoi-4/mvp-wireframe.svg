<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Phác thảo MVP hệ thống quản lý đặt bàn nhà hàng</title>
  <desc id="desc">Ba bước: khách gửi yêu cầu đặt bàn, nhân viên duyệt, khách tra cứu trạng thái đã xác nhận. Dữ liệu minh họa.</desc>
  <rect width="1200" height="650" fill="#f1f5f9"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="40" y="52" font-size="28" font-weight="bold">MVP · QUẢN LÝ ĐẶT BÀN NHÀ HÀNG</text>
    <text x="40" y="85" font-size="17" fill="#475569">Phác thảo ý tưởng · Dữ liệu minh họa · Luồng đặt bàn → duyệt → tra cứu</text>
    <g fill="white" stroke="#cbd5e1" stroke-width="2">
      <rect x="40" y="120" width="345" height="445" rx="14"/>
      <rect x="427" y="120" width="345" height="445" rx="14"/>
      <rect x="814" y="120" width="345" height="445" rx="14"/>
    </g>
    <g font-size="21" font-weight="bold">
      <text x="62" y="160">1. Khách đặt bàn</text>
      <text x="449" y="160">2. Nhân viên duyệt</text>
      <text x="836" y="160">3. Khách tra cứu</text>
    </g>
    <g font-size="16">
      <text x="62" y="200">Họ tên: Nguyễn Văn A</text>
      <text x="62" y="240">Số điện thoại: 0900000000</text>
      <text x="62" y="280">Ngày: ngày khách chọn</text>
      <text x="62" y="320">Khung giờ: 18:00 – 19:30</text>
      <text x="62" y="360">Số khách: 4</text>
      <text x="62" y="400">Bàn: tự chọn phù hợp</text>
      <text x="449" y="200">Danh sách yêu cầu đặt bàn</text>
      <text x="449" y="245" font-weight="bold">Nguyễn Văn A · 4 khách</text>
      <text x="449" y="280">18:00 – 19:30 · Bàn T2</text>
      <text x="449" y="320" fill="#92400e">Trạng thái: Chờ duyệt</text>
      <text x="449" y="425">Kiểm tra sức chứa, trùng lịch</text>
      <text x="449" y="455">Lưu trạng thái vào hệ thống</text>
      <text x="836" y="200">Nhập SĐT: 0900000000</text>
      <text x="836" y="325" font-weight="bold">Đặt bàn của Nguyễn Văn A</text>
      <text x="836" y="365">4 khách · Bàn T2</text>
      <text x="836" y="405">18:00 – 19:30</text>
      <text x="836" y="450" fill="#166534">Trạng thái: Đã xác nhận</text>
    </g>
    <g fill="#2563eb">
      <rect x="62" y="440" width="301" height="48" rx="8"/>
      <rect x="449" y="345" width="140" height="46" rx="8"/>
      <rect x="836" y="225" width="301" height="48" rx="8"/>
    </g>
    <rect x="610" y="345" width="140" height="46" rx="8" fill="#e2e8f0"/>
    <g font-size="17" text-anchor="middle">
      <text x="212" y="470" fill="white">Gửi yêu cầu</text>
      <text x="519" y="374" fill="white">Duyệt</text>
      <text x="680" y="374">Hủy</text>
      <text x="986" y="255" fill="white">Tra cứu</text>
    </g>
    <text x="62" y="530" font-size="15" fill="#475569">Kết quả ban đầu: Chờ duyệt</text>
    <text x="836" y="510" font-size="15" fill="#475569">Có thao tác hủy đặt bàn</text>
    <text x="40" y="610" font-size="17" fill="#475569">Phạm vi: tạo, tra cứu, duyệt, hủy đặt bàn · Kiểm tra sức chứa và xung đột khung giờ</text>
  </g>
</svg>
